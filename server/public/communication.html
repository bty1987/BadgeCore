<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>沟通详情 - BadgeCore</title>
<link rel="stylesheet" href="/assets/badge-ui.css">
<script src="/assets/app.js"></script>
</head>
<body>
<script>
const id = new URLSearchParams(location.search).get('id');
(async () => {
  const me = await fetch('/api/me').then(r => r.ok ? r.json() : null).catch(() => null);
  if (!me) { location.href = '/login.html'; return; }
  const main = mountAppShell('comm', me);
  if (!id) { main.innerHTML = '<div class="card">缺少 id 参数</div>'; return; }
  const c = await api('/api/communications/' + id);
  let rp = c.report && typeof c.report === 'object' ? c.report : (typeof c.report === 'string' ? (() => { try { return JSON.parse(c.report); } catch { return null; } })() : null);
  const curHistory = (c.meta && Array.isArray(c.meta.history)) ? c.meta.history : []; // 改标前的旧报告（INT-11）
  const stMap = { recorded: '已录制', transcribed: '已转写', analyzing: '分析中', analyzed: '已分析' };
  const SCENE = { sales: ['销售沟通', 'info'], meeting: ['会议纪要', 'on'], training: ['培训·讲座', 'warn'], talk: ['管理谈话', 'danger'] };
  const curScene = SCENE[c.scene] ? c.scene : 'sales';
  const ROLE_COLOR = { '销售': 'info', '设计师': 'info', '客户': 'success', '店长': 'warn' };
  const hasAudio = !!c.audio_path;
  const fmtSec = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  /** 逐句解析（录音回放对照）：优先 [MM:SS] 时间戳（讯飞分离回填=精确）；
   *  无时间戳的转写（实时听写）按字符占比估时（语速近似，UI 标注 ~） */
  function parseSegments(text, durationS) {
    const cleanTotal = text.replace(/\s/g, '').length || 1;
    let cursor = 0;
    return text.split(/\n+/).map(line => line.trim()).filter(Boolean).map(line => {
      const m = line.match(/^(?:([^：\[]{1,8})\s*[：:]\s*)?\[?(\d+):(\d+)\]?\s*([\s\S]*)$/);
      let role = '', body = line, t = null, approx = true;
      if (m) {
        role = (m[1] || '').trim();
        if (m[2] !== undefined && m[3] !== undefined && /\[\d+:\d+\]/.test(line)) { // 有显式 [MM:SS]
          t = Number(m[2]) * 60 + Number(m[3]); body = m[4]; approx = false;
        } else { body = line; }
      }
      if (t === null && durationS > 0) t = Math.min(durationS - 1, Math.round(durationS * cursor / cleanTotal));
      cursor += line.replace(/\s/g, '').length;
      return { role, text: body.trim(), t, approx };
    }).filter(s => s.text);
  }
  function renderTranscript(text) {
    const segs = parseSegments(text, c.duration_s || 0);
    if (!segs.length) return '<div style="white-space:pre-wrap;line-height:2">' + esc(text) + '</div>';
    return `<div style="font-size:12.5px;color:var(--text-3);margin-bottom:8px">${hasAudio ? '点击句子跳转播放' : ''}（${segs.some(s => !s.approx) ? '带分离时间戳·逐句精确' : '无时间戳·按语速近似定位'}）</div>` +
      segs.map((s, i) => `<div class="tr-line" data-i="${i}" data-t="${s.t ?? ''}" style="display:flex;gap:10px;align-items:baseline;padding:7px 10px;margin:0 -10px;border-radius:8px;${hasAudio ? 'cursor:pointer' : ''}">
      ${s.role ? `<span class="tag ${ROLE_COLOR[s.role] || 'info'}" style="flex:none;height:fit-content;margin-top:1px">${esc(s.role)}</span>` : ''}
      <div style="flex:1;line-height:1.9">${esc(s.text)}</div>
      ${s.t != null && hasAudio ? `<span class="num" style="flex:none;color:var(--text-3);font-size:12px">${s.approx ? '~' : ''}${fmtSec(s.t)}</span>` : ''}
    </div>`).join('');
  }
  main.innerHTML = `
    <div class="page-head"><a href="/communications.html">‹ 返回沟通列表</a>
      <h1 style="font-size:16px">${esc(c.topic || '沟通 #' + c.id)}</h1>
      <span class="tag ${SCENE[curScene][1]}">${SCENE[curScene][0]}</span>
      <span class="tag info">${stMap[c.status] || c.status || '-'}</span>
      <span style="color:var(--text-3);font-size:13px">${fmtTime(c.created_at)} · ${c.duration_s ? Math.floor(c.duration_s / 60) + ' 分 ' + (c.duration_s % 60) + ' 秒' : '时长未知'} · ${curScene === 'sales' ? '销售' : '归属'} ${esc(c.owner || '-')}${c.customer ? ' · 客户 ' + esc(c.customer.name) : ''}${curScene === 'talk' && c.participants ? ' · 参与者 ' + esc(c.participants) : ''}</span>
      <span class="spacer"></span>
      ${me.role !== 'sales' ? `<select id="scene-sel" style="height:30px">${Object.keys(SCENE).map(s => `<option value="${s}" ${s === curScene ? 'selected' : ''}>${SCENE[s][0]}</option>`).join('')}</select>
      <button class="btn" onclick="changeScene()">改标重析</button>` : ''}
      <button class="btn" onclick="reanalyze()">重新分析</button></div>
    <div class="tabbar">
      <a class="active" onclick="show(0,this)">字幕全文</a><a onclick="show(1,this)">摘要</a>
      <a onclick="show(2,this)">分析报告</a><a onclick="show(3,this)">${{ sales: '待办', meeting: '行动项', training: '考核题', talk: '双向承诺' }[curScene]}</a>
    </div>
    <div class="card" id="pane0">${hasAudio ? `
      <div id="audio-bar" style="display:flex;align-items:center;gap:12px;background:var(--primary-light);border-radius:10px;padding:10px 14px;margin-bottom:14px">
        <span style="color:var(--primary);flex:none">${icon('mic', 17)}</span>
        <audio id="audio" controls preload="metadata" style="flex:1;height:36px" src="/api/communications/${c.id}/audio"></audio>
        <span id="audio-note" style="flex:none;font-size:12px;color:var(--text-3)">原声回放</span>
      </div>` : ''}
      ${c.transcript ? renderTranscript(c.transcript) : '<div class="empty"><div class="empty-badge">' + icon('mic', 20) + '</div>转写尚未完成</div>'}</div>
    <div id="pane1" style="display:none">
      <div class="card" style="margin-bottom:14px"><div style="font-weight:600;margin-bottom:10px">全文摘要（ANA-01）</div>
        <div style="line-height:2;color:var(--text)">${rp?.summary ? esc(rp.summary) : '<div class="empty"><div class="empty-badge">' + icon('file-text', 20) + '</div>暂无摘要，等待分析完成</div>'}</div></div>
      ${rp?.key_facts?.length ? '<div class="card"><div style="font-weight:600;margin-bottom:10px">关键信息抽取</div><table class="tbl"><tbody>' + rp.key_facts.map(kf => '<tr><td style="width:150px;color:var(--text-2)">' + esc(kf.k) + '</td><td>' + esc(kf.v) + '</td></tr>').join('') + '</tbody></table></div>' : ''}
    </div>
    <div id="pane2" style="display:none">${renderReport(rp, curScene)}</div>
    <div class="card" id="pane3" style="display:none">${renderActionPane(rp, curScene)}</div>`;

  window.changeScene = async function () {
    const scene = document.getElementById('scene-sel').value;
    if (scene === curScene) { toast('场景未变化'); return; }
    if (scene === 'talk' && !confirm('切换为「管理谈话」后，该记录仅参与者与管理员可见（INT-40），确认？')) return;
    toast('已改标，重新分析中…');
    await api(`/api/communications/${id}/scene`, { method: 'POST', body: { scene } }).catch(() => {});
    setTimeout(() => location.reload(), 2500);
  };

  window.show = (i, el) => {
    document.querySelectorAll('.tabbar a').forEach(a => a.classList.remove('active'));
    el.classList.add('active');
    [0, 1, 2, 3].forEach(k => document.getElementById('pane' + k).style.display = k === i ? '' : 'none');
  };
  // 待办勾选（M4）：切换后整页刷新保持各面板一致
  main.addEventListener('change', async (e) => {
    if (!e.target.classList.contains('td-ck')) return;
    e.target.disabled = true;
    try { await api('/api/todos/' + e.target.dataset.id + '/toggle', { method: 'POST' }); setTimeout(() => location.reload(), 300); }
    catch { e.target.disabled = false; }
  });

  // 录音回放对照（REC-05）：点句跳播 + 播放中当前句高亮
  const audio = document.getElementById('audio');
  if (audio) {
    audio.addEventListener('error', () => { // 文件缺失/被清理：隐藏音频条，句子退化为只读
      const bar = document.getElementById('audio-bar'); if (bar) bar.style.display = 'none';
      document.querySelectorAll('.tr-line').forEach(el => el.style.cursor = 'default');
    });
    main.addEventListener('click', (e) => {
      const line = e.target.closest('.tr-line');
      if (!line || line.dataset.t === '' || !audio.src) return;
      audio.currentTime = Number(line.dataset.t);
      audio.play().catch(() => {});
      highlightLine(Number(line.dataset.i));
    });
    const highlightLine = (idx) => {
      document.querySelectorAll('.tr-line').forEach(el => {
        const on = Number(el.dataset.i) === idx;
        el.style.background = on ? 'rgba(51,112,255,.10)' : '';
        el.style.boxShadow = on ? 'inset 0 0 0 1px var(--primary-border)' : '';
      });
    };
    audio.addEventListener('timeupdate', () => {
      const lines = [...document.querySelectorAll('.tr-line')].filter(el => el.dataset.t !== '');
      let cur = -1;
      for (const el of lines) { if (Number(el.dataset.t) <= audio.currentTime + 0.01) cur = Number(el.dataset.i); else break; }
      if (cur >= 0 && !document.querySelector(`.tr-line[data-i="${cur}"]`)?.style.background) highlightLine(cur);
    });
  }
  window.reanalyze = async function () {
    toast('分析任务已提交…');
    await api(`/api/communications/${id}/analyze`, { method: 'POST' }).catch(() => {});
    setTimeout(() => location.reload(), 2000);
  };
  function renderActionPane(rp, scene) {
    if (scene === 'training') {
      if (!rp?.quiz?.length) return '<div class="empty"><div class="empty-badge">' + icon('file-text', 20) + '</div>暂无考核题（培训效果检验）</div>';
      return rp.quiz.map((q, i) => `<div style="padding:9px 0;border-bottom:1px solid #F0F2F7"><b>${i + 1}. ${esc(q.question)}</b><div style="color:var(--text-2);margin-top:4px">参考答案：${esc(q.answer || '')}</div></div>`).join('');
    }
    if (scene === 'talk') {
      if (!rp?.commitments?.length) return '<div class="empty"><div class="empty-badge">' + icon('users', 20) + '</div>未提取到双向承诺（事实层记录，不做评价）</div>';
      return rp.commitments.map(t => `<div style="padding:9px 0;border-bottom:1px solid #F0F2F7"><span class="tag ${t.by === '管理者' ? 'warn' : 'info'}">${esc(t.by || '?')}承诺</span> ${esc(t.what)} ${t.due ? `<span class="tag warn">时限 ${esc(t.due)}</span>` : ''}</div>`).join('');
    }
    // 待办/行动项（M4 流转）：读 todos 表（c.todos），勾选切换完成态
    const todos = (c.todos || []).filter(t => scene === 'meeting' ? t.kind === 'action' : t.kind === 'todo');
    const today = new Date().toISOString().slice(0, 10);
    if (!todos.length) return `<div class="empty"><div class="empty-badge">${icon('list-check', 20)}</div>暂无${scene === 'meeting' ? '行动项（会上承诺自动提取）' : '待办（从承诺事项自动提取）'}</div>`;
    return todos.map(t => `<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F0F2F7">
      <input type="checkbox" class="td-ck" data-id="${t.id}" ${t.status === 'done' ? 'checked' : ''} style="width:15px;height:15px;accent-color:#3370FF;cursor:pointer;flex:none" aria-label="完成">
      <span style="flex:1;min-width:0;${t.status === 'done' ? 'text-decoration:line-through;color:var(--text-3)' : ''}">${esc(t.what)}</span>
      ${t.owner && t.owner !== c.owner ? `<span class="tag info">${esc(t.owner)}</span>` : ''}
      ${t.due ? `<span class="tag ${t.status === 'open' && t.due < today ? 'danger' : 'warn'}">${t.status === 'open' && t.due < today ? '已到期 ' : '截止 '}${esc(t.due)}</span>` : ''}
      ${t.status === 'done' ? '<span class="tag on">已完成</span>' : ''}
    </div>`).join('');
  }
  function renderReport(rp, scene) {
    if (!rp) return '<div class="empty"><div class="empty-badge">' + icon('bot', 20) + '</div>暂无分析结果。点击右上角「重新分析」生成。</div>';
    const sec = (title, inner) => `<div class="card" style="margin-bottom:14px"><div style="font-weight:600;margin-bottom:10px">${title}</div>${inner}</div>`;
    const list = arr => '<ul style="margin:8px 0 0 18px;line-height:1.9">' + (arr || []).map(s => `<li>${esc(s)}</li>`).join('') + '<li style="list-style:none;color:var(--text-3)">' + ((arr || []).length ? '' : '无') + '</li></ul>';
    // —— 会议纪要（09 册 §4.1）——
    if (scene === 'meeting') {
      let html = sec('分议题摘要', (rp.topics || []).map(t => `
        <div style="padding:8px 0;border-bottom:1px solid #f3f4f6"><b>${esc(t.topic || '-')}</b>
          <div style="margin-top:4px"><span class="tag on">结论</span> ${esc(t.conclusion || '')}</div>
          <div style="color:var(--text-2);font-size:13px;margin-top:2px">讨论：${esc(t.discussion || '')}</div></div>`).join('') || '无');
      html += sec('会议决议', (rp.decisions || []).length ? (rp.decisions || []).map(d => `
        <div style="padding:8px 0;border-bottom:1px solid #F0F2F7"><span style="color:var(--success);margin-right:6px">${icon('check', 14)}</span>${esc(d.what)} ${d.owner ? `<span class="tag info">负责：${esc(d.owner)}</span>` : ''}
          <div style="color:var(--text-3);font-size:12.5px;margin-top:3px">依据：${esc(d.evidence || '')}</div></div>`).join('') : '<span style="color:var(--text-3)">未检出明确决议（讨论未定项见下方未决事项）</span>');
      html += sec('争议点', (rp.disputes || []).length ? (rp.disputes || []).map(d => `
        <div style="padding:8px 0;border-bottom:1px solid #f3f4f6"><b>${esc(d.topic || '-')}</b>
          <div style="font-size:13px;margin-top:4px">方A：${esc(d.side_a || '-')} ｜ 方B：${esc(d.side_b || '-')}</div>
          <div style="color:var(--text-3);font-size:12.5px">状态：${esc(d.status || '')}</div></div>`).join('') : '<span class="tag on">未检出明显争议</span>');
      html += sec('未决事项（下次会议回顾）', list(rp.open_issues));
      html += sec('发言人数估计', `<span class="tag info">${rp.attendees_hint ?? '-'} 人</span>（参会人请人工确认）`);
      return appendHistory(html, rp);
    }
    // —— 培训/讲座（09 册 §4.2）——
    if (scene === 'training') {
      let html = sec('知识点', (rp.knowledge_points || []).map(k => `
        <div style="padding:8px 0;border-bottom:1px solid #f3f4f6"><b>${esc(k.point || '-')}</b>
          <div style="color:var(--text-2);margin-top:3px">${esc(k.detail || '')}</div>
          <div style="color:var(--text-3);font-size:12.5px;margin-top:3px">依据：${esc(k.evidence || '')}</div></div>`).join('') || '无');
      if ((rp.qa || []).length) html += sec('现场答疑', rp.qa.map(x => `<div style="padding:8px 0;border-bottom:1px solid #f3f4f6"><span class="tag info">问</span> ${esc(x.q || '')}<div style="margin-top:3px"><span class="tag on">答</span> ${esc(x.a || '')}</div></div>`).join(''));
      if ((rp.quotes || []).length) html += sec('金句 / 关键表述', list(rp.quotes));
      if ((rp.chapters || []).length) html += sec('内容章节', rp.chapters.map(ch => `<div style="padding:6px 0;border-bottom:1px solid #f3f4f6">${ch.time_hint ? `<span class="tag off">${esc(ch.time_hint)}</span> ` : ''}<b>${esc(ch.title || '')}</b> <span style="color:var(--text-2);font-size:13px">${esc(ch.gist || '')}</span></div>`).join(''));
      return appendHistory(html, rp);
    }
    // —— 管理谈话（09 册 §4.3；K5 红线：无评分类字段）——
    if (scene === 'talk') {
      let html = sec('双向承诺', (rp.commitments || []).length ? rp.commitments.map(cm => `
        <div style="padding:8px 0;border-bottom:1px solid #f3f4f6"><span class="tag ${cm.by === '管理者' ? 'warn' : 'info'}">${esc(cm.by || '?')}</span> ${esc(cm.what)}
          ${cm.due ? `<span class="tag warn">时限 ${esc(cm.due)}</span>` : ''}
          <div style="color:var(--text-3);font-size:12.5px;margin-top:3px">依据：${esc(cm.evidence || '')}</div></div>`).join('') : '<span style="color:var(--text-3)">未检出明确承诺</span>');
      html += sec('讨论过的问题', list(rp.issues_discussed));
      html += sec('未达成一致', list(rp.unresolved));
      if (rp.next_review) html += sec('建议回顾', esc(rp.next_review));
      html += '<div class="card" style="background:var(--bg-2, #f9fafb)"><span style="color:var(--text-3);font-size:12.5px">本记录为事实层纪要，不含情绪/态度/绩效评分（09 册红线 K5）；可见范围=参与者与管理员（INT-40）。</span></div>';
      return appendHistory(html, rp);
    }
    // —— 销售沟通（03 册 ANA，原渲染不变）——
    let html = '';
    html += sec('客户立场（ANA-03）', `
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
        <div><span class="tag on">认同点</span><ul style="margin:8px 0 0 18px;line-height:1.9">${(rp.stance?.support || []).map(s => `<li>${esc(s)}</li>`).join('') || '<li style="list-style:none;color:var(--text-3)">无</li>'}</ul></div>
        <div><span class="tag danger">顾虑点</span><ul style="margin:8px 0 0 18px;line-height:1.9">${(rp.stance?.concerns || []).map(s => `<li>${esc(s)}</li>`).join('') || '<li style="list-style:none;color:var(--text-3)">无</li>'}</ul></div>
        <div><span class="tag off">未提及</span><ul style="margin:8px 0 0 18px;line-height:1.9">${(rp.stance?.unmentioned || []).map(s => `<li>${esc(s)}</li>`).join('') || '<li style="list-style:none;color:var(--text-3)">无</li>'}</ul></div>
      </div>`);
    html += sec('意向度评估（ANA-05）', rp.intention ? `
      <div style="display:flex;align-items:center;gap:20px">
        <div style="font-size:34px;font-weight:700;color:${rp.intention.score >= 70 ? 'var(--success)' : rp.intention.score >= 40 ? 'var(--warning)' : 'var(--danger)'}">${rp.intention.score}<span style="font-size:14px;color:var(--text-3)"> /100</span></div>
        <span class="tag ${rp.intention.level === '高' ? 'on' : rp.intention.level === '中' ? 'warn' : 'danger'}" style="font-size:14px">意向度：${rp.intention.level}</span>
        <div style="color:var(--text-2);font-size:13px">${(rp.intention.reasons || []).map(esc).join('；')}</div>
      </div>` : '无');
    if ((rp.competitors || []).length) html += sec('竞品提及（ANA-04）', rp.competitors.map(c => `
      <div style="padding:8px 0;border-bottom:1px solid #f3f4f6"><b>${esc(c.name)}</b> 提及 ${c.mentions || 0} 次
      ${c.our_advantage ? `<div style="color:var(--text-2);font-size:13px">我方优势：${esc(c.our_advantage)}</div>` : ''}
      ${c.risk ? `<div style="color:var(--danger);font-size:13px">风险：${esc(c.risk)}</div>` : ''}</div>`).join(''));
    if ((rp.tasks || []).length) html += sec('任务达成（ANA-06）', `<table class="tbl"><thead><tr><th>任务项</th><th style="width:90px">判定</th><th>依据原文</th></tr></thead><tbody>
      ${rp.tasks.map(t => `<tr><td>${esc(t.item)}</td><td><span class="tag ${t.status === '完成' ? 'on' : t.status === '不充分' ? 'warn' : 'off'}">${t.status}</span></td><td style="color:var(--text-2)">${esc(t.evidence || '')}</td></tr>`).join('')}</tbody></table>`);
    if ((rp.violations || []).length) html += sec('违规检测（ANA-08）', rp.violations.map(v => `
      <div style="padding:8px 0;border-bottom:1px solid #f3f4f6"><span class="tag danger">${esc(v.severity || '中')}</span> <b>${esc(v.item)}</b>
      <div style="color:var(--text-2);font-size:13px;margin-top:4px">证据：${esc(v.evidence || '')}</div></div>`).join(''));
    else html += sec('违规检测（ANA-08）', '<span class="tag on">已完成全量违规项检测，未发现任何违规内容</span>');
    return appendHistory(html, rp);
  }
  /** 改标历史（INT-11：旧报告版本化留存，可回看） */
  function appendHistory(html, rp) {
    const h = (rp && curHistory && curHistory.length) ? curHistory : [];
    if (!h.length) return html;
    return html + `<div class="card"><div style="font-weight:600;margin-bottom:10px">改标历史（${h.length} 份旧报告，INT-11）</div>` +
      h.map(x => `<div style="padding:6px 0;border-bottom:1px solid #f3f4f6;font-size:13px"><span class="tag off">${SCENE[x.scene] ? SCENE[x.scene][0] : x.scene}</span> ${fmtTime(x.at)} · 摘要：${esc((x.report?.summary || '').slice(0, 60))}…</div>`).join('') + '</div>';
  }
})();
</script>
</body>
</html>
