<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>客户 - BadgeCore</title>
<link rel="stylesheet" href="/assets/badge-ui.css">
<script src="/assets/app.js"></script>
</head>
<body>
<script>
(async () => {
  const me = await fetch('/api/me').then(r => r.ok ? r.json() : null).catch(() => null);
  if (!me) { location.href = '/login.html'; return; }
  const main = mountAppShell('cust', me.name);
  main.innerHTML = `
    <div class="page-head"><h1>客户</h1><span class="spacer"></span>
      <input id="q" placeholder="搜索客户名称…" style="min-width:200px" onkeydown="if(event.key==='Enter')load()">
      <button class="btn" onclick="load()">查询</button>
      <button class="btn primary" onclick="custDlg()">＋ 新建</button></div>
    <div class="card" style="padding:0" id="tbl"></div>
    <input type="file" id="file" accept=".csv" style="display:none">`;

  async function load() {
    const q = document.getElementById('q').value;
    const rows = await api('/api/customers?q=' + encodeURIComponent(q));
    renderTable(document.getElementById('tbl'), [
      { key: 'name', title: '客户名称', render: r => `<b>${esc(r.name)}</b>` },
      { key: 'phone', title: '联系方式', w: '130px', render: r => esc(r.phone || '-') },
      { key: 'industry', title: '行业', w: '100px', render: r => esc(r.industry || '-') },
      { key: 'profile', title: '画像', render: r => Object.entries(r.profile || {}).slice(0, 4).map(([k, v]) => `<span class="tag info" style="margin-right:4px">${esc(k)}:${esc(v)}</span>`).join('') || '<span style="color:var(--text-3)">-</span>' },
      { key: 'owner', title: '销售负责人', w: '100px', render: r => esc(r.owner || '-') },
      { key: 'last_comm_at', title: '最近沟通', w: '130px', render: r => { if (!r.last_comm_at) return '<span class="tag warn">沉默</span>'; const d = (Date.now() - new Date(r.last_comm_at)) / 86400e3; return d > 14 ? `<span class="tag danger">沉默 ${Math.floor(d)} 天</span>` : fmtTime(r.last_comm_at); } },
    ], rows, r => `<a onclick='custDlg(${JSON.stringify(r)})'>编辑</a>`);
  }
  window.load = load;
  window.custDlg = function (item) {
    item = item || {};
    dlg().open({
      title: item.id ? '编辑客户' : '新建客户',
      body: `
        <div class="form-item"><label><b>*</b> 客户名称</label><input id="_c_name" value="${esc(item.name || '')}"></div>
        <div class="form-item"><label>联系方式</label><input id="_c_phone" value="${esc(item.phone || '')}"></div>
        <div class="form-item"><label>行业</label><input id="_c_ind" value="${esc(item.industry || '')}"></div>
        ${item.id ? '' : `<div class="form-item"><label>销售负责人</label><input id="_c_owner" value="${esc(me.name)}"></div>`}
        <div class="form-item"><label>备注</label><textarea id="_c_note">${esc(item.note || '')}</textarea></div>`,
      foot: [
        { label: '取 消', onClick: d => d.close() },
        { label: '保 存', cls: 'primary', onClick: async d => {
            const name = document.getElementById('_c_name').value.trim();
            if (!name) { toast('请填写客户名称'); return; }
            const body = { name, phone: document.getElementById('_c_phone').value, industry: document.getElementById('_c_ind').value, note: document.getElementById('_c_note').value };
            if (item.id) await api('/api/customers/' + item.id, { method: 'PUT', body });
            else await api('/api/customers', { method: 'POST', body: { ...body, owner: document.getElementById('_c_owner')?.value || me.name } });
            d.close(); toast('已保存'); load();
          } },
      ],
    });
  };
  load();
})();
</script>
</body>
</html>
