<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>消息 · BadgeCore</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/assets/badge-ui.css">
<script src="/assets/app.js"></script>
</head>
<body>
<div id="top"></div>
<div class="sidelayout">
<div id="side"></div>
<div class="main" style="padding-top:20px">
<div class="wrap">
  <div class="card">
    <h2>站内消息（定时报告推送投递箱，AI-11）</h2>
    <table><thead><tr><th>时间</th><th>标题</th><th>内容</th></tr></thead><tbody id="tbody"></tbody></table>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
async function api(url, opts) {
  const res = await fetch(url, opts);
  if (res.status === 401) { location.href = '/login.html'; throw 0; }
  return res;
}
async function load() {
  const me = await (await api('/api/me')).json();
  { const w = document.getElementById('who'); if (w) w.textContent = `${me.name}（${me.role}） 未读 ${''}`; }
  const d = await (await api('/api/notifications')).json();
  { const w = document.getElementById('who'); if (w) w.textContent = `${me.name}（${me.role}） 未读 ${d.unread}`; }
  $('tbody').innerHTML = d.rows.map(n => `
    <tr style="${n.read ? 'opacity:.55' : ''}">
      <td>${(n.created_at || '').replace('T', ' ').slice(0, 16)}</td>
      <td><b>${n.read ? '' : '● '}${esc(n.title)}</b></td>
      <td style="white-space:pre-wrap">${esc(n.body)}</td>
    </tr>`).join('') || '<tr><td colspan="3" class="muted">暂无消息。定时任务在「沟通配置→定时报告」里创建。</td></tr>';
}
async function markAll() { await api('/api/notifications/read', { method: 'POST' }); load(); }
load();
</script>
</body>
</html>
