<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>会议详情 - BadgeCore</title>
<link rel="stylesheet" href="/assets/badge-ui.css?v=20261122b">
<script src="/assets/app.js?v=20261122b"></script>
<script src="/assets/m-ui.js?v=20261122b"></script>
</head>
<body>
<script>
(async () => {
  const shell = await initMShell('meetings', '会议详情', { back: '/m/meetings.html' });
  if (!shell) return;
  const { page } = shell;
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { page.innerHTML = '<div class="m-empty">缺少 id 参数</div>'; return; }
  page.innerHTML = '<div class="m-empty">加载中…</div>';
  const mt = await api('/api/meetings/' + id).catch(() => null);
  if (!mt) { page.innerHTML = '<div class="m-empty">会议不存在或无权访问</div>'; return; }
  const SC = { sales: '销售', meeting: '会议', training: '培训', talk: '谈话' };
  page.innerHTML = `
    <div class="m-card"><b style="font-size:15px">${esc(mt.name)}</b>
      <div style="font-size:12.5px;color:var(--text-3);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap">
        <span>${mt.meeting_at ? fmtTime(mt.meeting_at) : '时间未定'}</span>
        ${mt.location ? `<span>${esc(mt.location)}</span>` : ''}
        <span>组织人 ${esc(mt.owner || '公海')}</span><span>沟通 ${mt.comm_count} 条</span></div>
      ${mt.note ? `<div style="font-size:13px;color:var(--text-2);margin-top:8px">${esc(mt.note)}</div>` : ''}</div>
    <div class="m-card"><b style="font-size:14px">归属沟通</b><div style="margin-top:6px">
      ${mt.comms.length ? mt.comms.map(c => `<a class="m-row" style="padding:8px 0;border-bottom:1px solid var(--border);color:var(--text)" href="/m/comm.html?id=${c.id}">
        <span class="tag info" style="flex:none">${SC[c.scene] || c.scene}</span>
        <div class="m-grow"><b style="font-size:13.5px">${esc(c.topic || '')}</b>
          <div style="font-size:12px;color:var(--text-3)">${fmtTime(c.created_at)} · ${esc(c.owner || '-')}${c.customer ? ' · 客户 ' + esc(c.customer.name) : ''}</div></div></a>`).join('')
      : '<div class="m-empty">暂无归属沟通</div>'}</div></div>`;
})();
</script>
</body>
</html>
