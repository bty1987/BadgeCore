<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>沟通详情 - BadgeCore</title>
<link rel="stylesheet" href="/assets/badge-ui.css?v=20261122b">
<script src="/assets/app.js?v=20261122b"></script>
<script src="/assets/m-ui.js?v=20261122b"></script>
</head>
<body>
<script>
(async () => {
  const shell = await initMShell('comms', '沟通详情', { back: '/m/comms.html' });
  if (!shell) return;
  const { page } = shell;
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { page.innerHTML = '<div class="m-empty">缺少 id 参数</div>'; return; }
  page.innerHTML = '<div class="m-empty">加载中…</div>';
  const c = await api('/api/communications/' + id).catch(() => null);
  if (!c) { page.innerHTML = '<div class="m-empty">记录不存在或无权访问</div>'; return; }
  const rp = c.report && typeof c.report === 'object' ? c.report : null;
  const SC = { sales: '销售沟通', meeting: '会议', training: '培训', talk: '谈话' };
  const stMap = { recorded: '已录制', transcribed: '已转写', analyzing: '分析中', analyzed: '已分析', failed: '失败' };
  page.innerHTML = `
    <div class="m-card">
      <b style="font-size:15px">${esc(c.topic || topicFallback(c))}</b>
      <div style="font-size:12.5px;color:var(--text-3);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap">
        <span class="tag info">${SC[c.scene] || c.scene}</span><span class="tag">${stMap[c.status] || c.status}</span>
        <span>${fmtTime(c.created_at)}</span><span>${c.duration_s ? Math.floor(c.duration_s / 60) + ' 分 ' + c.duration_s % 60 + ' 秒' : '时长未知'}</span>
        <span>归属 ${esc(c.owner || '-')}</span>
        ${c.customer ? `<span>客户 ${esc(c.customer.name)}</span>` : ''}${c.meeting ? `<span>会议 ${esc(c.meeting.name)}</span>` : ''}</div>
      ${c.audio_path ? `<audio controls style="width:100%;margin-top:10px" src="/api/communications/${c.id}/audio"></audio>` : ''}
    </div>
    ${rp ? `
    <div class="m-card"><b style="font-size:14px">AI 摘要</b>
      <div style="font-size:13px;color:var(--text-2);margin-top:6px;white-space:pre-wrap">${esc(rp.summary || '-')}</div>
      <div style="font-size:11.5px;color:var(--text-4);margin-top:8px">以上内容由 AI 生成，仅供参考</div></div>
    ${(rp.key_facts || []).length ? `<div class="m-card"><b style="font-size:14px">关键信息</b>
      ${rp.key_facts.map(k => `<div class="m-row" style="padding:6px 0;border-bottom:1px solid var(--border)">
        <span style="flex:none;font-size:12.5px;color:var(--text-3)">${esc(k.k || '')}</span>
        <span class="m-grow" style="font-size:13px">${esc(k.v || '')}</span></div>`).join('')}</div>` : ''}
    ${(rp.action_items || []).length ? `<div class="m-card"><b style="font-size:14px">行动项</b>
      ${rp.action_items.map(t => `<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:13px">· ${esc(t.what || t.item || '')}${t.owner ? `（${esc(t.owner)}${t.due ? ' ' + esc(t.due) : ''}）` : ''}</div>`).join('')}</div>` : ''}`
    : `<div class="m-card"><div style="font-size:13px;color:var(--text-3)">${c.status === 'analyzed' ? '' : '报告尚未生成（转写完成后自动分析）'}</div></div>`}
    ${(c.todos || []).length ? `<div class="m-card"><b style="font-size:14px">待办</b>
      ${c.todos.map(t => `<div class="m-row" style="padding:6px 0;border-bottom:1px solid var(--border)">
        <span class="tag ${t.status === 'done' ? 'success' : 'warn'}" style="flex:none">${t.status === 'done' ? '已完成' : '待办'}</span>
        <span class="m-grow" style="font-size:13px">${esc(t.what)}</span>
        ${t.due ? `<span style="font-size:12px;color:var(--text-3);flex:none">${esc(t.due)}</span>` : ''}</div>`).join('')}</div>` : ''}`;
})();
</script>
</body>
</html>
