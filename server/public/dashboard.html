<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>指挥舱 · 数据看板 - BadgeCore</title>
<link rel="stylesheet" href="/assets/badge-ui.css">
<script src="/assets/app.js"></script>
<style>
  .bar { height: 10px; border-radius: 5px; background: var(--primary-light); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--primary); border-radius: 5px; }
</style>
</head>
<body>
<div id="top"></div>
<div class="sidelayout">
  <div id="side"></div>
  <div class="main">
    <div class="page-head"><h1>指挥舱 · 数据看板</h1>
      <select id="days" onchange="load()" style="width:auto">
        <option value="7">近 7 天</option><option value="30" selected>近 30 天</option>
        <option value="90">近 90 天</option><option value="365">近一年</option>
      </select></div>
    <div class="tabbar" id="tabs">
      <a class="active" onclick="showView(0,this)">工作台总览</a><a onclick="showView(1,this)">团队报告</a>
      <a onclick="showView(2,this)">任务达成排行</a><a onclick="showView(3,this)">能力评估排行</a>
      <a onclick="showView(4,this)">违规分布</a><a onclick="showView(5,this)">最新沟通</a>
      <a onclick="showView(6,this)">导出</a>
    </div>
    <div id="views"></div>
  </div>
</div>
<script>
let D = null;
(async () => {
  const me = await fetch('/api/me').then(r => r.ok ? r.json() : null).catch(() => null);
  if (!me) { location.href = '/login.html'; return; }
  if (me.role === 'sales') { document.querySelector('.main').innerHTML = '<div class="card">数据看板仅管理者可见。</div>'; return; }
  initShell('dashboard');
  const views = document.getElementById('views');
  for (let i = 0; i < 7; i++) {
    const v = document.createElement('div'); v.id = 'view' + i;
    if (i) v.style.display = 'none';
    views.appendChild(v);
  }
  window.showView = (i, el) => {
    document.querySelectorAll('#tabs a').forEach(a => a.classList.remove('active'));
    el.classList.add('active');
    for (let k = 0; k < 7; k++) document.getElementById('view' + k).style.display = k === i ? '' : 'none';
  };
  window.load = async function () {
    const days = document.getElementById('days').value;
    D = await api('/api/dashboard?days=' + days);
    const o = D.overview;
    document.getElementById('view0').innerHTML = `
      <div class="stat-row">
        <div class="stat-card"><div class="k">沟通总数</div><div class="v">${o.comm_count}</div><div class="sub">近 ${D.days} 天</div></div>
        <div class="stat-card"><div class="k">沟通总时长</div><div class="v">${Math.round(o.total_duration / 60)}</div><div class="sub">分钟</div></div>
        <div class="stat-card"><div class="k">参与销售</div><div class="v">${o.user_count}</div><div class="sub">人</div></div>
        <div class="stat-card"><div class="k">违规沟通占比</div><div class="v" style="color:${o.violation_rate > 10 ? 'var(--danger)' : 'var(--text)'}">${o.violation_rate}%</div><div class="sub">命中违规/风险</div></div>
        <div class="stat-card"><div class="k">平均意向度</div><div class="v">${o.avg_intention ?? '-'}</div><div class="sub">0-100</div></div>
      </div>
      <div class="card"><div style="font-weight:600;margin-bottom:12px">每日沟通趋势</div><div id="trend" style="display:flex;align-items:flex-end;gap:4px;height:160px"></div></div>`;
    renderTrend();
    const merged = mergeUsers();
    document.getElementById('view1').innerHTML = `<div class="card" style="padding:16px"><div style="font-weight:600;margin-bottom:10px">团队效能报告（按人聚合）</div>${teamTable(merged)}</div>`;
    document.getElementById('view2').innerHTML = `<div class="card" style="padding:16px"><div style="font-weight:600;margin-bottom:10px">任务达成排行榜（对照任务模型）</div>${rankTable(D.rank_tasks, 'task')}</div>`;
    document.getElementById('view3').innerHTML = `<div class="card" style="padding:16px"><div style="font-weight:600;margin-bottom:10px">能力评估排行榜（平均意向度）</div>${rankTable(D.rank_ability, 'intention')}</div>`;
    document.getElementById('view4').innerHTML = `<div class="card" style="padding:16px"><div style="font-weight:600;margin-bottom:10px">团队违规次数分布</div>
      ${D.violation_dist.length ? `<table class="tbl"><thead><tr><th>销售</th><th>违规沟通数</th><th>占其沟通比例</th></tr></thead><tbody>
      ${D.violation_dist.map(v => `<tr><td>${esc(v.owner)}</td><td>${v.violations}</td><td><span class="tag danger">${v.rate}%</span></td></tr>`).join('')}</tbody></table>`
      : '<span class="tag on">已完成全量违规项检测，未发现任何违规内容</span>'}</div>`;
    document.getElementById('view5').innerHTML = `<div class="card" style="padding:0"><table class="tbl"><thead><tr><th>时间</th><th>销售</th><th>主题</th><th>状态</th><th>预警</th></tr></thead><tbody>
      ${D.recent.map(r => `<tr><td>${fmtTime(r.created_at)}</td><td>${esc(r.owner || '-')}</td>
        <td><a href="/communication.html?id=${r.id}">${esc(r.topic || '沟通 #' + r.id)}</a></td>
        <td>${esc(r.status || '-')}</td><td>${r.alerts ? `<span class="tag danger">${r.alerts} 条</span>` : '-'}</td></tr>`).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--text-3);padding:20px">暂无沟通</td></tr>'}</tbody></table></div>`;
    document.getElementById('view6').innerHTML = `<div class="card" style="padding:16px">
      <div style="font-weight:600;margin-bottom:10px">导出（CMP-13 水印导出）</div>
      <div style="color:var(--text-2);font-size:13px;margin-bottom:12px">导出文件含访问者水印（导出人/时间），并记入审计日志。</div>
      <a class="btn primary" href="/api/dashboard/export?days=${D.days}">导出近 ${D.days} 天数据</a></div>`;
  };
  function renderTrend() {
    const days = D.by_day.slice(-30);
    const max = Math.max(1, ...days.map(x => x.count));
    document.getElementById('trend').innerHTML = days.map(x =>
      `<div style="flex:1;text-align:center" title="${x.date}: ${x.count} 次"><div style="font-size:10px;color:var(--text-3)">${x.count || ''}</div>
       <div class="bar" style="height:${Math.max(4, x.count / max * 130)}px;background:var(--primary);margin:4px 0"></div>
       <div style="font-size:9px;color:var(--text-3)">${x.date.slice(5)}</div></div>`).join('');
  }
  function mergeUsers() {
    const m = {};
    D.rank_tasks.forEach(u => m[u.owner] = { ...u });
    D.rank_ability.forEach(u => m[u.owner] = { ...(m[u.owner] || { owner: u.owner, count: 0, duration: 0, violations: 0 }), intention: u.intention });
    return Object.values(m).sort((a, b) => b.count - a.count);
  }
  function teamTable(rows) {
    if (!rows.length) return '<div class="empty">暂无数据</div>';
    return `<table class="tbl"><thead><tr><th>销售</th><th>沟通数</th><th>时长(分)</th><th>任务达成率</th><th>平均意向度</th><th>违规数</th></tr></thead><tbody>
      ${rows.map(u => `<tr><td><b>${esc(u.owner)}</b></td><td>${u.count}</td><td>${Math.round(u.duration / 60)}</td>
        <td>${u.task_rate != null ? u.task_rate + '%' : '-'}</td><td>${u.intention ?? '-'}</td><td>${u.violations || 0}</td></tr>`).join('')}</tbody></table>`;
  }
  function rankTable(rows, kind) {
    if (!rows.length) return '<div class="empty"><div class="empty-badge">' + icon('chart', 20) + '</div>暂无排行数据</div>';
    const label = kind === 'task' ? '任务达成率' : '平均意向度';
    const val = u => kind === 'task' ? u.task_rate : u.intention;
    return `<table class="tbl"><thead><tr><th>销售</th><th>沟通数</th><th>时长(分)</th><th style="width:220px">${label}</th></tr></thead><tbody>
      ${rows.map((u, i) => `<tr><td><b>${i + 1}</b> ${esc(u.owner)}</td><td>${u.count}</td><td>${Math.round(u.duration / 60)}</td>
        <td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:${val(u)}%"></i></div><b>${val(u)}${kind === 'task' ? '%' : ''}</b></div></td></tr>`).join('')}</tbody></table>`;
  }
  load();
})();
</script>
</body>
</html>
