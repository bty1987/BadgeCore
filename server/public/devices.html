<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设备管理 · BadgeCore</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="topbar">
  <span class="brand">BadgeCore</span>
  <nav>
    <a href="/">沟通记录</a>
    <a href="/customers.html">客户</a>
    <a href="/ask.html">Ask AI</a>
    <a href="/attendance.html">考勤</a>
    <a href="/devices.html" class="active">设备</a>
    <a href="/config.html">沟通配置</a>
    <a href="/settings.html">设置</a>
    <a href="/notifications.html">消息</a>
  </nav>
  <span class="spacer"></span><span class="who" id="who"></span>
  <button onclick="location='/login.html'">退出</button>
</div>
<div class="wrap">
  <div class="card">
    <h2>设备台账（04 册设备管理域；设备录音入库时自动注册上线）</h2>
    <table>
      <thead><tr><th>设备标识</th><th>型号</th><th>固件</th><th>持有人</th><th>状态</th><th>最近活跃</th><th>操作</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="muted" style="margin-top:8px">绑定/解绑写操作日志与审计；固件升级走 receiver OTA 通道（量产期再纳入灰度管理，D16）。</div>
  </div>
  <div class="card">
    <h2>操作日志（对标 ★ badge operation-log）</h2>
    <table><thead><tr><th>时间</th><th>设备</th><th>动作</th><th>明细</th></tr></thead><tbody id="logs"></tbody></table>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
async function api(url, opts) {
  const res = await fetch(url, opts);
  if (res.status === 401) { location.href = '/login.html'; throw 0; }
  return res;
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = iso => iso ? iso.replace('T', ' ').slice(0, 16) : '-';
const ACT = { session: '录音会话', bind: '绑定', unbind: '解绑', offline: '离线' };
async function init() {
  const me = await (await api('/api/me')).json();
  $('who').textContent = `${me.name}（${me.role}）`;
  const rows = await (await api('/api/devices')).json();
  $('tbody').innerHTML = rows.map(d => `
    <tr>
      <td>${esc(d.device_key)}</td><td>${esc(d.model) || '-'}</td><td>${esc(d.fw_version) || '-'}</td>
      <td contenteditable id="own-${d.id}">${esc(d.owner)}</td>
      <td><span class="badge ${d.status === 'online' ? 'analyzed' : 'low'}">${d.status === 'online' ? '在线' : '离线'}</span></td>
      <td>${fmt(d.last_seen_at)}</td>
      <td>
        <button onclick="bind(${d.id})">保存绑定</button>
        <button class="danger" onclick="unbind(${d.id})">解绑</button>
      </td>
    </tr>`).join('') || '<tr><td colspan="7" class="muted" style="padding:14px">暂无设备。receiver 入库会话会自动注册设备。</td></tr>';
  const logs = await (await api('/api/devices/logs')).json();
  $('logs').innerHTML = logs.map(l => `
    <tr><td>${fmt(l.ts)}</td><td>${esc(l.device_key)}</td><td>${ACT[l.action] || l.action}</td><td class="evidence">${esc(l.detail)}</td></tr>`).join('')
    || '<tr><td colspan="4" class="muted">暂无日志。</td></tr>';
}
async function bind(id) {
  await api(`/api/devices/${id}/bind`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ owner: document.getElementById(`own-${id}`).textContent.trim() }) });
  init();
}
async function unbind(id) {
  await api(`/api/devices/${id}/bind`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ owner: '' }) });
  init();
}
init();
</script>
</body>
</html>
