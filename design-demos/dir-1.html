<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方向一 · 一枚徽章（佐藤可士和）— BadgeCore 改版提案</title>
<!--
Design decisions (C1 · 佐藤可士和「一枚徽章，说了算」):
- 全站唯一形状记号 = 圆角方 chip（radius 6px）：logo、切换器、头像、状态点同形——「Badge」长在产品名上
- 色彩配给制：90% 灰白 + 10% 唯一暖色朱红 #E8432D，只绑「今天/行动/进行中」一个语义；蓝 #2F6BFF 降级为链接色
- 字重跳档（700/800 vs 400）替代字号碎档；48px 打卡机大数字给销售今日士气
- 切换：方案 A+ 单一壳，左栏顶部 44px 工作区切换器，两侧同构，Ctrl/Cmd+Shift+S 翻转
-->
<style>
:root {
  --red: #D0341A; --red-deep: #B82B14; --red-bg: #FDEEEB;
  --ink: #1F2329; --ink-2: #5A6072; --ink-3: #5F6673;
  --line: #E7E9ED; --bg: #F2F3F5; --face: #FFFFFF;
  --blue: #1D4FC4;
  --r-sm: 6px; --r-md: 10px;
  --shadow: 0 1px 2px rgba(31,35,41,.06);
  --side-w: 232px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "MiSans", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--blue); text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- 壳：侧栏（两侧 100% 同构，只换菜单） ---------- */
.shell { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--side-w); background: var(--face); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0; z-index: 20;
}
/* 工作区切换器：44px 高，侧栏第一格，不随菜单滚动 */
.ws-btn {
  margin: 12px 12px 4px; height: 44px; width: calc(100% - 24px);
  display: flex; align-items: center; gap: 10px; padding: 0 10px;
  background: var(--bg); border: 1px solid transparent; border-radius: var(--r-sm);
  transition: background .15s;
}
.ws-btn:hover { background: #EAECF0; }
.ws-chip {
  width: 24px; height: 24px; border-radius: 6px; flex: none;
  display: flex; align-items: center; justify-content: center; color: #fff;
}
.ws-chip svg { width: 14px; height: 14px; }
.ws-name { font-size: 14px; font-weight: 700; letter-spacing: 0; }
.ws-chev { margin-left: auto; color: var(--ink-3); transition: transform .15s; }
.ws-btn[aria-expanded="true"] .ws-chev { transform: rotate(180deg); }
/* 切换下拉 */
.ws-menu {
  position: fixed; z-index: 60; width: 288px; background: var(--face);
  border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: 0 12px 40px rgba(31,35,41,.16);
  padding: 6px; display: none;
}
.ws-menu.show { display: block; animation: pop .16s ease; }
@keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
.ws-opt {
  width: 100%; display: flex; gap: 10px; align-items: flex-start; text-align: left;
  padding: 10px; border: 0; background: none; border-radius: 8px;
}
.ws-opt:hover { background: var(--bg); }
.ws-opt .ws-chip { margin-top: 1px; }
.ws-opt .t { font-size: 14px; font-weight: 700; line-height: 1.4; display: flex; align-items: center; gap: 6px; }
.ws-opt .d { font-size: 12px; color: var(--ink-2); line-height: 1.5; margin-top: 1px; }
.ws-opt .ck { margin-left: auto; color: var(--red); flex: none; visibility: hidden; }
.ws-opt[aria-checked="true"] .ck { visibility: visible; }
.ws-opt[aria-checked="true"] { background: var(--bg); }
.ws-menu .foot { border-top: 1px solid var(--line); margin-top: 6px; padding: 8px 10px 4px; font-size: 12px; color: var(--ink-3); }

/* 菜单 */
.nav-scroll { flex: 1; overflow-y: auto; padding: 8px 12px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px;
  border-radius: var(--r-sm); color: var(--ink-2); font-size: 13.5px; margin: 1px 0;
  position: relative; transition: background .12s, color .12s;
}
.nav-item svg { width: 16px; height: 16px; flex: none; }
.nav-item:hover { background: var(--bg); color: var(--ink); }
.nav-item.on { background: #FDEEEB; color: var(--ink); font-weight: 700; }
.nav-item.on::before {
  content: ''; position: absolute; left: 0; top: 7px; bottom: 7px; width: 3px;
  border-radius: 2px; background: var(--red);
}
.nav-item.on svg { color: var(--red); }
.nav-group { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: .04em; padding: 14px 10px 4px; }
.nav-group svg { width: 12px; height: 12px; }
/* 销售侧常驻区：今日待办迷你摘要 */
.side-todo { margin: 10px 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.side-todo .t { display: flex; align-items: baseline; gap: 6px; font-size: 12px; font-weight: 700; padding: 0 10px 6px; }
.side-todo .t .num { color: var(--red); font-size: 14px; font-weight: 800; }
.side-todo .r { display: flex; gap: 7px; align-items: center; font-size: 12.5px; color: var(--ink-2); padding: 4px 10px; border-radius: 6px; cursor: pointer; }
.side-todo .r:hover { background: var(--bg); color: var(--ink); }
.side-todo .r i { width: 8px; height: 8px; border-radius: 2.5px; background: var(--red); opacity: .25; flex: none; }
.side-todo .r i.hot { opacity: 1; }
/* 账户区（头像回归账户语义） */
.account { position: relative; margin: 8px 12px 12px; }
.acc-btn { width: 100%; display: flex; align-items: center; gap: 9px; padding: 7px 8px; background: none; border: 0; border-radius: var(--r-sm); }
.acc-btn:hover { background: var(--bg); }
.avatar { width: 28px; height: 28px; border-radius: 8px; background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
.acc-name { font-size: 13px; font-weight: 700; line-height: 1.3; }
.acc-role { font-size: 12px; color: var(--ink-3); line-height: 1.3; }
.acc-menu { position: absolute; bottom: calc(100% + 6px); left: 0; right: 0; background: var(--face); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: 0 8px 28px rgba(31,35,41,.14); padding: 5px; display: none; }
.acc-menu.show { display: block; animation: pop .15s ease; }
.acc-menu button { width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 9px; font-size: 13px; border: 0; background: none; border-radius: 6px; color: var(--ink); }
.acc-menu button:hover { background: var(--bg); }
.acc-menu button svg { width: 14px; height: 14px; color: var(--ink-2); }

/* ---------- 主区 ---------- */
.main { flex: 1; margin-left: var(--side-w); padding: 26px 30px 40px; min-width: 0; }
.page-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 20px; }
.page-head h1 { font-size: 20px; font-weight: 800; letter-spacing: 0; line-height: 1.4; }
.page-head .sub { font-size: 13px; color: var(--ink-3); margin-top: 2px; }
.page-head .sp { flex: 1; }
.btn {
  display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 16px;
  border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--face);
  color: var(--ink); font-size: 13.5px; font-weight: 500; transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--bg); }
.btn svg { width: 15px; height: 15px; }
.btn.primary { background: var(--red); border-color: var(--red); color: #fff; font-weight: 700; }
.btn.primary:hover { background: var(--red-deep); border-color: var(--red-deep); }
.btn.sm { height: 30px; padding: 0 12px; font-size: 12.5px; }

/* 卡片：一档阴影、一档圆角，不再层层漂浮 */
.card { background: var(--face); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 20px 22px; }
.card .card-t { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card .card-t .more { margin-left: auto; font-size: 12.5px; font-weight: 400; color: var(--ink-3); }
.card .card-t .more:hover { color: var(--blue); }

/* 打卡机大数字（销售首页主角） */
.punch { display: flex; align-items: center; gap: 18px; }
.punch .big { font-size: 48px; font-weight: 800; color: var(--red); letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.punch .lab { font-size: 15px; font-weight: 700; }
.punch .src { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.punch .go { margin-left: auto; }

/* 统计行：主次分明（次级卡弱化） */
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.stat { background: var(--face); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 16px 18px; }
.stat .k { font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 7px; }
.stat .k .chip-ic { width: 20px; height: 20px; border-radius: 6px; background: var(--bg); color: var(--ink-2); display: flex; align-items: center; justify-content: center; flex: none; }
.stat .k .chip-ic svg { width: 12px; height: 12px; }
.stat .v { font-size: 26px; font-weight: 800; margin-top: 8px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.stat .s { font-size: 12px; color: var(--ink-3); margin-top: 3px; }

/* 列表行 */
.row { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.row:last-child { border-bottom: 0; }
.row .tm { color: var(--ink-3); font-size: 12.5px; font-variant-numeric: tabular-nums; flex: none; }
.row .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot-sq { width: 8px; height: 8px; border-radius: 2.5px; flex: none; }

/* 标签：深色文字 + 淡底（对比度达标） */
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 5px; font-size: 12px; font-weight: 500; line-height: 1.8; flex: none; }
.tag.red { background: var(--red-bg); color: #A02A1B; }
.tag.gray { background: #EEF0F3; color: var(--ink-2); }
.tag.green { background: #E8F5E9; color: #1B5E20; }
.tag.blue { background: #E8EFFF; color: #1D4FC4; }
.tag.amber { background: #FFF3E0; color: #8A5A00; }

/* 引用降级为一行弱文案 */
.muse { font-size: 12.5px; color: var(--ink-3); padding: 12px 2px 0; }
.muse::before { content: '“'; } .muse::after { content: '”'; }

/* 表格：40px 密度 */
.tbl-wrap { background: var(--face); border-radius: var(--r-md); box-shadow: var(--shadow); overflow: hidden; }
table.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 12px; font-weight: 500; color: var(--ink-3); padding: 10px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { font-size: 13px; padding: 10px 16px; border-bottom: 1px solid #F0F1F4; vertical-align: top; line-height: 1.5; }
.tbl tbody tr:hover td { background: #FAFBFC; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl .ops { white-space: nowrap; }
.tbl .ops a { margin-right: 12px; font-size: 13px; }
.tbl .ops a.danger { color: #C93520; }
.cell-sub { color: var(--ink-3); font-size: 12px; margin-top: 1px; }
.trig { color: var(--ink-2); }

/* 页内 tab */
.seg { display: inline-flex; gap: 2px; background: #E9EBEF; border-radius: 8px; padding: 3px; margin-bottom: 14px; }
.seg button { border: 0; background: none; padding: 6px 16px; border-radius: 6px; font-size: 13px; color: var(--ink-2); font-weight: 500; }
.seg button.on { background: var(--face); color: var(--ink); font-weight: 700; box-shadow: var(--shadow); }

/* 空态（线性图标 + 引导，无 emoji） */
.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 26px 0 20px; color: var(--ink-3); font-size: 13px; }
.empty .ring { width: 44px; height: 44px; border-radius: 12px; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--ink-3); }
.empty .ring svg { width: 20px; height: 20px; }

/* toast */
#toast { position: fixed; top: 20px; left: 50%; transform: translate(-50%, -8px); background: rgba(31,35,41,.94); color: #fff; padding: 9px 20px; border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: all .22s; z-index: 99; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
.mt14 { margin-top: 14px; }
.help { font-size: 12.5px; color: var(--ink-3); margin: -12px 0 14px; }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <button class="ws-btn" id="ws-btn" aria-haspopup="menu" aria-expanded="false" title="切换工作区 (Ctrl+Shift+S)">
      <span class="ws-chip" id="ws-chip"></span>
      <span class="ws-name" id="ws-name">销售工作台</span>
      <span class="ws-chev" id="ws-chev"></span>
    </button>
    <nav class="nav-scroll" id="nav"></nav>
    <div class="account">
      <button class="acc-btn" id="acc-btn" aria-haspopup="menu" aria-expanded="false">
        <span class="avatar">白</span>
        <span><span class="acc-name">白添宇</span><br><span class="acc-role" id="acc-role">销售 · 管理员</span></span>
      </button>
      <div class="acc-menu" id="acc-menu" role="menu">
        <button onclick="toast('演示原型：打开个人设置')"><span data-ic="user"></span>个人设置</button>
        <button onclick="toast('演示原型：退出登录')"><span data-ic="logout"></span>退出登录</button>
      </div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<!-- 工作区切换下拉 -->
<div class="ws-menu" id="ws-menu" role="menu" aria-label="切换工作区">
  <button class="ws-opt" role="menuitemradio" data-ws="sales" aria-checked="true">
    <span class="ws-chip" style="background:var(--red)"><span data-ic="mic"></span></span>
    <span><span class="t">销售工作台 <span class="ck" data-ic="check"></span></span>
    <span class="d">我的沟通、客户与今日待办</span></span>
  </button>
  <button class="ws-opt" role="menuitemradio" data-ws="admin" aria-checked="false">
    <span class="ws-chip" style="background:var(--ink)"><span data-ic="shield"></span></span>
    <span><span class="t">管理后台 <span class="ck" data-ic="check"></span></span>
    <span class="d">九域配置、组织与数据看板</span></span>
  </button>
  <div class="foot">上次访问：管理后台 · 违规检测 &nbsp;·&nbsp; Ctrl+Shift+S 快速切换</div>
</div>

<div id="toast"></div>

<script>
/* ---------- 图标（24 线性，stroke currentColor） ---------- */
const ICONS = {
  home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
  mic: '<path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/>',
  users: '<circle cx="9" cy="7" r="4"/><path d="M2 21v-1a6 6 0 0 1 12 0v1"/><path d="M16 3.5a4 4 0 0 1 0 7M17 14a5 5 0 0 1 5 5v2"/>',
  trophy: '<path d="M8 21h8M12 17v4M7 4h10v6a5 5 0 0 1-10 0z"/><path d="M7 5H4a3 3 0 0 0 3 5M17 5h3a3 3 0 0 1-3 5"/>',
  chart: '<path d="M3 3v18h18"/><path d="M8 16v-5M13 16V8M18 16v-8"/>',
  sliders: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M2 14h4M10 8h4M18 16h4"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M3 10h18"/>',
  building: '<path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"/><path d="M16 8h3a1 1 0 0 1 1 1v12M8 7h2M8 11h2M8 15h2M12 21v-4"/>',
  shield: '<path d="M12 2l8 3v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5z"/>',
  bulb: '<path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.4 1 2.3h6c0-.9.4-1.8 1-2.3A7 7 0 0 0 12 2z"/>',
  database: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  gear: '<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/>',
  bot: '<rect x="4" y="8" width="16" height="12" rx="3"/><circle cx="9" cy="14" r="1.1"/><circle cx="15" cy="14" r="1.1"/><path d="M12 8V4M9 4h6"/>',
  alert: '<path d="M12 2L22 20H2z"/><path d="M12 9v5M12 17.5v.01"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/>',
  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/>',
  listcheck: '<path d="M3 6l2 2 3-3M3 14l2 2 3-3M11 6h10M11 15h10"/>',
  gauge: '<path d="M20 14a8 8 0 1 0-16 0"/><path d="M12 14l4-5.5"/><circle cx="12" cy="14" r="1.3"/>',
  message: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  route: '<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8 8c6 2 2 6 8 8"/>',
  octagon: '<path d="M7.9 2h8.2L22 7.9v8.2L16.1 22H7.9L2 16.1V7.9z"/><path d="M12 8v4M12 16v.01"/>',
  flag: '<path d="M4 22V4c0 0 3-2 8 0s8 0 8 0v10c0 0-3 2-8 0s-8 0-8 0"/>',
  layers: '<path d="M12 2l10 5-10 5L2 7z"/><path d="M2 12l10 5 10-5M2 17l10 5 10-5"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>',
  upload: '<path d="M12 16V4M6 10l6-6 6 6M4 20h16"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  check: '<path d="M4 12l5 5L20 7"/>',
  chevdown: '<path d="M6 9l6 6 6-6"/>',
  inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
};
function ic(name, sz = 16) {
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;
}
document.querySelectorAll('[data-ic]').forEach(el => {
  const cls = el.getAttribute('class');
  el.outerHTML = ic(el.dataset.ic, 14).replace('<svg ', '<svg' + (cls ? ' class="' + cls + '"' : '') + ' ');
});

function toast(msg) {
  let t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- 工作区定义（单一壳，只换菜单与主区） ---------- */
const WORKSPACES = {
  sales: {
    name: '销售工作台', chipBg: 'var(--red)', chipIcon: 'mic', role: '销售 · 管理员',
    lastPage: '首页',
    nav: [
      ['home', 'home', '首页', true],
      ['comm', 'mic', '沟通', false],
      ['cust', 'users', '客户', false],
      ['cases', 'trophy', '案例库', false],
      ['dash', 'chart', '看板', false],
    ],
    sideTodo: {
      title: '今日待办', count: 6,

function applyWS(ws) {
  current = ws;
  const W = WORKSPACES[ws];
  $('#ws-chip').style.background = W.chipBg;
  $('#ws-chip').innerHTML = ic(W.chipIcon, 14);
  $('#ws-name').textContent = W.name;
  $('#acc-role').textContent = W.role;
  $('#nav').innerHTML = renderNav(ws);
  $('#main').innerHTML = renderMain(ws);
  window.scrollTo(0, 0);
  $('#main').scrollTop = 0;
  document.querySelectorAll('.ws-opt').forEach(o => o.setAttribute('aria-checked', String(o.dataset.ws === ws)));
}

/* ---------- 切换器交互 ---------- */
const wsBtn = $('#ws-btn'), wsMenu = $('#ws-menu');
function openWS() {
  const r = wsBtn.getBoundingClientRect();
  wsMenu.style.left = r.left + 'px';
  wsMenu.style.top = (r.bottom + 6) + 'px';
  wsMenu.classList.add('show');
  wsBtn.setAttribute('aria-expanded', 'true');
}
function closeWS() { wsMenu.classList.remove('show'); wsBtn.setAttribute('aria-expanded', 'false'); }
wsBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  wsMenu.classList.contains('show') ? closeWS() : openWS();
});
wsMenu.addEventListener('click', (e) => e.stopPropagation());
document.querySelectorAll('.ws-opt').forEach(o => o.addEventListener('click', () => {
  const target = o.dataset.ws;
  closeWS();
  if (target !== current) { applyWS(target); toast(target === 'sales' ? '已切换到销售工作台' : '已切换到管理后台'); }
}));
document.addEventListener('click', () => { closeWS(); accMenu.classList.remove('show'); accBtn.setAttribute('aria-expanded', 'false'); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeWS(); accMenu.classList.remove('show'); }
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'S' || e.key === 's')) {
    e.preventDefault();
    const t = current === 'sales' ? 'admin' : 'sales';
    applyWS(t); toast(t === 'sales' ? '已切换到销售工作台' : '已切换到管理后台');
  }
  // 下拉内方向键
  if (wsMenu.classList.contains('show') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault();
    const opts = [...wsMenu.querySelectorAll('.ws-opt')];
    const i = opts.indexOf(document.activeElement);
    const n = e.key === 'ArrowDown' ? (i + 1) % opts.length : (i - 1 + opts.length) % opts.length;
    opts[n].focus();
  }
});

/* ---------- 账户菜单 ---------- */
const accBtn = $('#acc-btn'), accMenu = $('#acc-menu');
accBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const show = !accMenu.classList.contains('show');
  accMenu.classList.toggle('show', show);
  accBtn.setAttribute('aria-expanded', String(show));
});
accMenu.addEventListener('click', (e) => e.stopPropagation());

applyWS('sales');
</script>
