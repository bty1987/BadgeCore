<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方向三 · 淡蓝底分区（飞书系）— BadgeCore 改版提案</title>
<!--
Design decisions (C4 · 飞书「淡蓝底分区 + 舒服的中文」):
- 页面底 #F0F3FA 是「泛着品牌蓝的蓝灰」，约 30% 面积带着品牌温度；卡片纯白 borderless + 一档浅阴影
- 激活态三重编码：浅蓝底 + 蓝字 + 左 3px 蓝条（顺手修掉现状可访问性缺陷）
- 顶栏 48px 常驻全局搜索 + 通知 + 账户；切换器在侧栏顶部（方案 A+，两侧同构）
- 品牌蓝 #3370FF；中文正文 14px/1.6；卡片圆角 10px
- 切换：Ctrl/Cmd+Shift+S 翻转；下拉带两工作区描述与上次访问
-->
<style>
:root {
  --bg: #F0F3FA; --face: #FFFFFF;
  --ink: #1F2329; --ink-2: #51565F; --ink-3: #646B76;
  --line: rgba(31, 35, 41, .06);
  --blue: #3370FF; --blue-deep: #2B5FD9;
  --act-bg: #F0F4FF; --act-bd: #E1EAFF; --blue-ink: #1D4FC4;
  --shadow: 0 1px 4px rgba(31, 35, 41, .06);
  --side-w: 224px; --top-h: 48px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--blue-ink); text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- 壳 ---------- */
.shell { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--side-w); background: var(--face); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; position: fixed; top: var(--top-h); bottom: 0; left: 0; z-index: 20;
}
/* 顶栏（两侧同构） */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; height: var(--top-h); background: var(--face);
  box-shadow: 0 1px 0 var(--line); display: flex; align-items: center; padding: 0 16px; gap: 12px; z-index: 30;
}
.brand { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; }
.brand .logo { width: 24px; height: 24px; border-radius: 7px; background: linear-gradient(135deg, #3370FF, #5A8BFF); box-shadow: 0 2px 6px rgba(51,112,255,.35); }
.global-search {
  flex: 1; max-width: 380px; margin: 0 auto; display: flex; align-items: center; gap: 8px;
  background: var(--bg); border-radius: 8px; padding: 7px 12px; color: var(--ink-3); font-size: 13px; cursor: text;
}
.global-search svg { width: 14px; height: 14px; flex: none; }
.global-search .kbd { margin-left: auto; font-size: 12px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: #fff; }
.top-ic { width: 32px; height: 32px; border-radius: 8px; border: 0; background: none; color: var(--ink-2); display: flex; align-items: center; justify-content: center; position: relative; }
.top-ic:hover { background: var(--bg); }
.top-ic svg { width: 17px; height: 17px; }
.top-ic .dot { position: absolute; top: 6px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); border: 1.5px solid #fff; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #3370FF, #5A8BFF); color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; }

/* 工作区切换器 */
.ws-btn {
  margin: 12px 12px 4px; height: 44px; width: calc(100% - 24px);
  display: flex; align-items: center; gap: 10px; padding: 0 10px;
  background: none; border: 1px solid var(--line); border-radius: 10px;
  transition: background .15s, border-color .15s;
}
.ws-btn:hover { background: var(--bg); }
.ws-chip { width: 24px; height: 24px; border-radius: 7px; flex: none; display: flex; align-items: center; justify-content: center; color: #fff; }
.ws-chip svg { width: 14px; height: 14px; }
.ws-name { font-size: 14px; font-weight: 600; }
.ws-chev { margin-left: auto; color: var(--ink-3); transition: transform .15s; }
.ws-btn[aria-expanded="true"] .ws-chev { transform: rotate(180deg); }
.ws-menu {
  position: fixed; z-index: 60; width: 288px; background: var(--face);
  border-radius: 12px; box-shadow: 0 12px 40px rgba(31,35,41,.16); padding: 6px; display: none;
  border: 1px solid var(--line);
}
.ws-menu.show { display: block; animation: pop .16s ease; }
@keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
.ws-opt { width: 100%; display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 10px; border: 0; background: none; border-radius: 8px; }
.ws-opt:hover { background: var(--bg); }
.ws-opt .t { font-size: 14px; font-weight: 600; line-height: 1.4; display: flex; align-items: center; gap: 6px; }
.ws-opt .d { font-size: 12px; color: var(--ink-2); margin-top: 1px; }
.ws-opt .ck { margin-left: auto; color: var(--blue); visibility: hidden; }
.ws-opt[aria-checked="true"] .ck { visibility: visible; }
.ws-opt[aria-checked="true"] { background: var(--act-bg); }
.ws-menu .foot { border-top: 1px solid var(--line); margin-top: 6px; padding: 8px 10px 4px; font-size: 12px; color: var(--ink-3); }

/* 菜单：激活态三重编码 */
.nav-scroll { flex: 1; overflow-y: auto; padding: 8px 12px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px;
  border-radius: 8px; color: var(--ink-2); font-size: 13.5px; margin: 1px 0; position: relative;
  transition: background .12s, color .12s;
}
.nav-item svg { width: 16px; height: 16px; flex: none; color: var(--ink-3); }
.nav-item:hover { background: var(--bg); color: var(--ink); }
.nav-item.on { background: var(--act-bg); color: var(--blue-ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--act-bd); }
.nav-item.on svg { color: var(--blue-ink); }
.nav-item.on::before { content: ''; position: absolute; left: -12px; top: 6px; bottom: 6px; width: 3px; border-radius: 0 3px 3px 0; background: var(--blue); }
.nav-group { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink-3); padding: 14px 10px 4px; }
.nav-group svg { width: 12px; height: 12px; }
.side-todo { margin: 10px 12px; background: var(--act-bg); border-radius: 10px; padding: 10px 12px; }
.side-todo .t { display: flex; align-items: baseline; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--blue-ink); padding-bottom: 5px; }
.side-todo .t .num { font-size: 14px; font-weight: 700; }
.side-todo .r { display: flex; gap: 7px; align-items: center; font-size: 12.5px; color: var(--ink-2); padding: 3.5px 0; cursor: pointer; }
.side-todo .r:hover { color: var(--ink); }
.side-todo .r i { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); opacity: .4; flex: none; }
.side-todo .r i.hot { opacity: 1; }

/* ---------- 主区 ---------- */
.main { flex: 1; margin-left: var(--side-w); padding: calc(var(--top-h) + 22px) 26px 40px; min-width: 0; }
.page-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 16px; }
.page-head h1 { font-size: 18px; font-weight: 700; line-height: 1.5; }
.page-head .sub { font-size: 13px; color: var(--ink-3); margin-top: 1px; }
.page-head .sp { flex: 1; }
.btn {
  display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 15px;
  border-radius: 8px; border: 1px solid var(--line); background: var(--face);
  color: var(--ink); font-size: 13px; font-weight: 500; transition: background .12s, box-shadow .12s;
}
.btn:hover { background: var(--bg); }
.btn svg { width: 15px; height: 15px; }
.btn.primary { background: #2B5FD9; border-color: #2B5FD9; color: #fff; box-shadow: 0 2px 8px rgba(51,112,255,.3); }
.btn.primary:hover { background: #244FC0; }
.btn.sm { height: 30px; padding: 0 12px; font-size: 12.5px; }

.card { background: var(--face); border-radius: 10px; box-shadow: var(--shadow); padding: 18px 20px; }
.card .card-t { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card .card-t svg { color: var(--ink-3); }
.card .card-t .more { margin-left: auto; font-size: 12.5px; font-weight: 400; color: var(--ink-3); }
.card .card-t .more:hover { color: var(--blue-ink); }

.greet { display: flex; align-items: center; }
.greet .tx { font-size: 17px; font-weight: 700; }
.greet .sub { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.greet .act { margin-left: auto; display: flex; gap: 10px; }

.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 14px; }
.stat { background: var(--face); border-radius: 10px; box-shadow: var(--shadow); padding: 15px 18px; }
.stat .k { font-size: 12.5px; color: var(--ink-2); }
.stat .v { font-size: 26px; font-weight: 700; margin-top: 6px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat .v.blue { color: var(--blue); }
.stat .s { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
.row { display: flex; align-items: center; gap: 10px; padding: 8.5px 2px; border-bottom: 1px solid #F0F2F7; font-size: 13.5px; }
.row:last-child { border-bottom: 0; }
.row .tm { color: var(--ink-3); font-size: 12.5px; font-variant-numeric: tabular-nums; flex: none; }
.row .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px 0 16px; color: var(--ink-3); font-size: 13px; }
.empty .ring { width: 42px; height: 42px; border-radius: 50%; background: var(--act-bg); color: var(--blue); opacity: .7; display: flex; align-items: center; justify-content: center; }
.empty .ring svg { width: 19px; height: 19px; }

/* 标签：深色文字 + 淡底 */
.tag { display: inline-flex; align-items: center; padding: 1px 9px; border-radius: 6px; font-size: 12px; font-weight: 500; line-height: 1.8; flex: none; }
.tag.blue { background: #E8EFFF; color: #1D4FC4; }
.tag.green { background: #E8F7E9; color: #1B7A22; }
.tag.gray { background: #F0F1F4; color: var(--ink-2); }
.tag.red { background: #FDEBEC; color: #C0332D; }
.tag.amber { background: #FFF3DC; color: #996400; }

/* 表格 40px 密度 */
.tbl-wrap { background: var(--face); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
table.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 12px; font-weight: 500; color: var(--ink-3); padding: 10px 16px; border-bottom: 1px solid #F0F2F7; white-space: nowrap; }
.tbl td { font-size: 13px; padding: 10px 16px; border-bottom: 1px solid #F5F6FA; vertical-align: top; line-height: 1.5; }
.tbl tbody tr:hover td { background: #F7F9FE; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl .ops { white-space: nowrap; }
.tbl .ops a { margin-right: 12px; font-size: 13px; }
.tbl .ops a.danger { color: #C0332D; }
.entry-name { font-weight: 600; }
.cell-sub { color: var(--ink-3); font-size: 12px; margin-top: 1px; }
.trig { color: var(--ink-2); }

.seg { display: inline-flex; gap: 2px; background: #E6E9F2; border-radius: 999px; padding: 3px; margin-bottom: 14px; }
.seg button { border: 0; background: none; padding: 6px 16px; border-radius: 999px; font-size: 13px; color: var(--ink-2); font-weight: 500; }
.seg button.on { background: var(--face); color: var(--ink); font-weight: 600; box-shadow: 0 2px 8px rgba(31,35,41,.08); }
.help { font-size: 12.5px; color: var(--ink-3); margin: -8px 0 14px; }
.mt { margin-top: 14px; }
.muse { font-size: 12.5px; color: var(--ink-3); padding: 10px 2px 0; }
.muse::before { content: '“'; } .muse::after { content: '”'; }

#toast { position: fixed; top: 64px; left: 50%; transform: translate(-50%, -8px); background: rgba(31,35,41,.94); color: #fff; padding: 9px 20px; border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: all .22s; z-index: 99; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo"></span>BadgeCore</div>
  <div class="global-search" onclick="toast('演示原型：全局搜索')">
    <span data-ic="search"></span>搜索沟通、客户、配置…
    <span class="kbd">Ctrl K</span>
  </div>
  <button class="top-ic" onclick="toast('演示原型：通知中心')" aria-label="通知"><span data-ic="bell"></span><span class="dot"></span></button>
  <div class="avatar" title="白添宇 · 管理员" onclick="toast('演示原型：个人设置')">白</div>
</header>

<div class="shell">
  <aside class="sidebar">
    <button class="ws-btn" id="ws-btn" aria-haspopup="menu" aria-expanded="false" title="切换工作区 (Ctrl+Shift+S)">
      <span class="ws-chip" id="ws-chip"></span>
      <span class="ws-name" id="ws-name">销售工作台</span>
      <span class="ws-chev" id="ws-chev"></span>
    </button>
    <nav class="nav-scroll" id="nav"></nav>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="ws-menu" id="ws-menu" role="menu" aria-label="切换工作区">
  <button class="ws-opt" role="menuitemradio" data-ws="sales" aria-checked="true">
    <span class="ws-chip" style="background:linear-gradient(135deg,#3370FF,#5A8BFF)"><span data-ic="mic"></span></span>
    <span><span class="t">销售工作台 <span class="ck" data-ic="check"></span></span><span class="d">我的沟通、客户与今日待办</span></span>
  </button>
  <button class="ws-opt" role="menuitemradio" data-ws="admin" aria-checked="false">
    <span class="ws-chip" style="background:linear-gradient(135deg,#1F2329,#51565F)"><span data-ic="shield"></span></span>
    <span><span class="t">管理后台 <span class="ck" data-ic="check"></span></span><span class="d">九域配置、组织与数据看板</span></span>
  </button>
  <div class="foot">上次访问：管理后台 · 违规检测 &nbsp;·&nbsp; Ctrl+Shift+S 快速切换</div>
</div>

<div id="toast"></div>

<script>
const ICONS = {
  home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
  mic: '<path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/>',
  users: '<circle cx="9" cy="7" r="4"/><path d="M2 21v-1a6 6 0 0 1 12 0v1"/><path d="M16 3.5a4 4 0 0 1 0 7M17 14a5 5 0 0 1 5 5v2"/>',
  trophy: '<path d="M8 21h8M12 17v4M7 4h10v6a5 5 0 0 1-10 0z"/><path d="M7 5H4a3 3 0 0 0 3 5M17 5h3a3 3 0 0 1-3 5"/>',
  chart: '<path d="M3 3v18h18"/><path d="M8 16v-5M13 16V8M18 16v-8"/>',
  sliders: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M2 14h4M10 8h4M18 16h4"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M3 10h18"/>',
  building: '<path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"/><path d="M16 8h3a1 1 0 0 1 1 1v12M8 7h2M8 11h2M8 15h2M12 21v-4"/>',
  shield: '<path d="M12 2l8 3v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5z"/>',
  bulb: '<path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.4 1 2.3h6c0-.9.4-1.8 1-2.3A7 7 0 0 0 12 2z"/>',
  database: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  gear: '<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/>',
  bot: '<rect x="4" y="8" width="16" height="12" rx="3"/><circle cx="9" cy="14" r="1.1"/><circle cx="15" cy="14" r="1.1"/><path d="M12 8V4M9 4h6"/>',
  alert: '<path d="M12 2L22 20H2z"/><path d="M12 9v5M12 17.5v.01"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/>',
  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/>',
  listcheck: '<path d="M3 6l2 2 3-3M3 14l2 2 3-3M11 6h10M11 15h10"/>',
  gauge: '<path d="M20 14a8 8 0 1 0-16 0"/><path d="M12 14l4-5.5"/><circle cx="12" cy="14" r="1.3"/>',
  message: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  route: '<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8 8c6 2 2 6 8 8"/>',
  octagon: '<path d="M7.9 2h8.2L22 7.9v8.2L16.1 22H7.9L2 16.1V7.9z"/><path d="M12 8v4M12 16v.01"/>',
  flag: '<path d="M4 22V4c0 0 3-2 8 0s8 0 8 0v10c0 0-3 2-8 0s-8 0-8 0"/>',
  layers: '<path d="M12 2l10 5-10 5L2 7z"/><path d="M2 12l10 5 10-5M2 17l10 5 10-5"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>',
  bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
  check: '<path d="M4 12l5 5L20 7"/>',
  chevdown: '<path d="M6 9l6 6 6-6"/>',
  upload: '<path d="M12 16V4M6 10l6-6 6 6M4 20h16"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
};
function ic(name, sz = 16) {
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;
}
document.querySelectorAll('[data-ic]').forEach(el => {
  const cls = el.getAttribute('class');
  el.outerHTML = ic(el.dataset.ic, 14).replace('<svg ', '<svg' + (cls ? ' class="' + cls + '"' : '') + ' ');
});
function toast(msg) {
  let t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
}

const WORKSPACES = {
  sales: {
    name: '销售工作台', chip: 'linear-gradient(135deg,#3370FF,#5A8BFF)', chipIcon: 'mic',
    nav: [
      ['home', 'home', '首页', true],
      ['comm', 'mic', '沟通', false],
      ['cust', 'users', '客户', false],
      ['cases', 'trophy', '案例库', false],
      ['dash', 'chart', '看板', false],
    ],
    sideTodo: { title: '今日待办', count: 6, rows: [['回访华润张经理，确认二期报价', true], ['发送定制方案 v3 给万科采购部', false], ['整理上周会议纪要行动项', false]] },
  },
  admin: {
    name: '管理后台', chip: 'linear-gradient(135deg,#1F2329,#51565F)', chipIcon: 'shield',
    groups: [
      ['沟通配置', 'sliders', [
        ['信息收集', 'file', false], ['成交模型', 'target', false], ['任务模型', 'listcheck', false],
        ['能力模型', 'gauge', false], ['沟通总结', 'message', false], ['沟通分析', 'sliders', false],
        ['沟通流程', 'route', false], ['违规检测', 'octagon', true], ['竞争对手', 'flag', false],
      ]],

}

function applyWS(ws) {
  current = ws;
  const W = WORKSPACES[ws];
  $('#ws-chip').style.background = W.chip;
  $('#ws-chip').innerHTML = ic(W.chipIcon, 14);
  $('#ws-name').textContent = W.name;
  $('#nav').innerHTML = renderNav(ws);
  $('#main').innerHTML = renderMain(ws);
  window.scrollTo(0, 0);
  document.querySelectorAll('.ws-opt').forEach(o => o.setAttribute('aria-checked', String(o.dataset.ws === ws)));
}

const wsBtn = $('#ws-btn'), wsMenu = $('#ws-menu');
function openWS() {
  const r = wsBtn.getBoundingClientRect();
  wsMenu.style.left = r.left + 'px';
  wsMenu.style.top = (r.bottom + 6) + 'px';
  wsMenu.classList.add('show');
  wsBtn.setAttribute('aria-expanded', 'true');
}
function closeWS() { wsMenu.classList.remove('show'); wsBtn.setAttribute('aria-expanded', 'false'); }
wsBtn.addEventListener('click', (e) => { e.stopPropagation(); wsMenu.classList.contains('show') ? closeWS() : openWS(); });
wsMenu.addEventListener('click', (e) => e.stopPropagation());
document.querySelectorAll('.ws-opt').forEach(o => o.addEventListener('click', () => {
  const target = o.dataset.ws;
  closeWS();
  if (target !== current) { applyWS(target); toast(target === 'sales' ? '已切换到销售工作台' : '已切换到管理后台'); }
}));
document.addEventListener('click', () => closeWS());
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeWS();
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'S' || e.key === 's')) {
    e.preventDefault();
    const t = current === 'sales' ? 'admin' : 'sales';
    applyWS(t); toast(t === 'sales' ? '已切换到销售工作台' : '已切换到管理后台');
  }
});

applyWS('sales');
</script>
